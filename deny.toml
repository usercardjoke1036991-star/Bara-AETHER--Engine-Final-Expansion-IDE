# Política de soberanía: licencias y advisories (cargo-deny).
[advisories]
yanked = "warn"
# Ignorar advisory concretos aquí si un día hace falta (documentar el porqué).

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/usercardjoke1036991-star/Bara-AETHER--Engine-Final-Expansion.git",
]
