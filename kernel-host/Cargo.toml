# Proceso hijo del kernel. El IDE lo supervisa; un pánico aquí no es un pánico
# del proceso de Tauri. Sin red, sin shells y sin `unsafe`.
[package]
name = "bara-kernel-host"
version = "0.5.0"
edition = "2021"
description = "Sidecar del kernel Bara para el IDE"
license = "MIT"
publish = false

# Las ops `fault-*` existen sólo en las pruebas. El instalador no las activa.
[features]
faults = []

[dependencies]
bara = { git = "https://github.com/usercardjoke1036991-star/Bara-AETHER--Engine-Final-Expansion.git", rev = "fa3d308552f3cc69ccdab8f141d56399e35c2ff6" }
bara-ide = { path = "..", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bara-ide = { path = "..", features = ["serde"] }
serde_json = "1"

[[bin]]
name = "bara-kernel-host"
path = "src/main.rs"
