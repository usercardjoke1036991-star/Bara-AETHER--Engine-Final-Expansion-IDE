name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Autenticación para el crate `bara` (repo privado del kernel).
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Autenticar git para el kernel privado
      shell: bash
      env:
        KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
      run: |
        git config --global url."https://x-access-token:${KERNEL_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
    # Set de escritorio de Tauri v2 en Debian/Ubuntu
    # (https://v2.tauri.app/start/prerequisites/). libwebkit2gtk-4.1-dev
    # arrastra GTK 3, de modo que pkg-config resuelve gio-2.0, glib-2.0 y
    # gdk-3.0. No hay paquetes de Android: el APK sigue fuera de esta puerta.
    - name: Dependencias de sistema de Tauri
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev
    # El pin del kernel vive en Cargo.toml (rev SHA). Rust queda en 1.99.0,
    # la misma versión con la que se empaqueta el escritorio de Windows.
    - name: Instalar Rust 1.99.0
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: 1.99.0
        components: clippy, rustfmt
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests
      run: cargo test --locked --verbose
    - name: Proceso del kernel
      run: |
        cargo test --manifest-path kernel-host/Cargo.toml --features faults --locked
        cargo clippy --manifest-path kernel-host/Cargo.toml --all-targets --features faults --locked -- -D warnings
        cargo fmt --manifest-path kernel-host/Cargo.toml --all -- --check
        python3 src-tauri/scripts/stage-kernel-host.py --profile debug
    # build.rs emite --exclude-all-symbols para todo target env=gnu, incluido
    # Linux. rust-lld lo rechaza. El wrapper lo retira; el producto no cambia.
    - name: Escritorio Tauri
      env:
        RUSTFLAGS: -C linker=${{ github.workspace }}/.github/linux-link.py
      run: |
        chmod +x .github/linux-link.py
        cargo test --manifest-path src-tauri/Cargo.toml --locked
    # El repo no es un workspace: el paquete de la raíz y el de src-tauri
    # se comprueban por separado. Ninguno reformatea el kernel enlazado.
    - name: rustfmt
      run: |
        cargo fmt --all -- --check
        cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
        cargo fmt --manifest-path kernel-host/Cargo.toml --all -- --check
    - name: clippy
      env:
        RUSTFLAGS: -C linker=${{ github.workspace }}/.github/linux-link.py
      run: |
        chmod +x .github/linux-link.py
        cargo clippy --all-targets --locked -- -D warnings
        cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
        cargo clippy --manifest-path kernel-host/Cargo.toml --all-targets --features faults --locked -- -D warnings
    - name: cargo-deny (licencias y advisories)
      uses: EmbarkStudios/cargo-deny-action@348a7eb4414a21044d5863ee3a575f8758a7e0a7 # v2.0.11
      with:
        command: check
        arguments: --all-features
    - name: cargo-audit
      uses: rustsec/audit-check@dd5177dedaf0c2f0415bbe82c0a05cabaebea08c # v2.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    # tsc, Vitest y el autodiagnóstico no ejecutan el CLI de Tauri ni vite build.
    # package.json no declara preinstall, install, postinstall ni prepare.
    - name: Frontend
      run: npm ci --ignore-scripts && npm run typecheck && npm test && npm run test:ai

  # MSVC en windows-latest: el runner trae VS/Build Tools y WebView2; ring y
  # Tauri enlazan sin instalar LLVM MinGW (más frágil en GHA). El target local
  # gnu sigue documentado en el README para desarrolladores.
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Autenticar git para el kernel privado
      shell: bash
      env:
        KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
      run: |
        git config --global url."https://x-access-token:${KERNEL_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
    - name: Instalar Rust 1.99.0 (MSVC)
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: 1.99.0
        components: clippy, rustfmt
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests
      run: cargo test --locked --verbose
    # En windows-latest (MSVC) el harness `bara_ide_desktop_lib` aborta al
    # arrancar con STATUS_ENTRYPOINT_NOT_FOUND (DLL de WebView2/CRT en el
    # runner). Se verifica compilación + enlace; la ejecución de tests del
    # backend queda en Ubuntu, donde el harness sí corre.
    - name: Kernel-host + Tauri (compilar)
      run: |
        cargo test --manifest-path kernel-host/Cargo.toml --features faults --locked
        python src-tauri/scripts/stage-kernel-host.py --profile debug
        cargo build --manifest-path src-tauri/Cargo.toml --locked
        cargo test --manifest-path src-tauri/Cargo.toml --locked --no-run
    - name: Frontend
      run: npm ci --ignore-scripts && npm run typecheck && npm test && npm run test:ai
