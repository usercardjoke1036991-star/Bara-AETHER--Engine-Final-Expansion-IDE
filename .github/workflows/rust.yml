name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    # `actions/checkout` rechaza `path: ../BAR` porque queda fuera de
    # `$GITHUB_WORKSPACE`. El núcleo entra en `./BAR-local` y un enlace lo
    # publica en el hermano `../BAR`, que es lo que leen
    # `Cargo.toml` (`../BAR`) y `src-tauri/Cargo.toml` (`../../BAR`).
    # Esta tarea corre en `ubuntu-latest`; no hace falta una unión de Windows.
    - name: Clone Bara Core Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: usercardjoke1036991-star/Bara-AETHER--Engine-Final-Expansion
        # Commit de `dev` del kernel. Se sube a mano cuando el IDE debe seguir
        # un kernel nuevo; una rama móvil recompilaría el IDE contra código
        # que aún no se ha visto.
        ref: b916ff9da35cc74844771b91857b53f6606ba02b
        token: ${{ secrets.KERNEL_READ_TOKEN }}
        path: BAR-local
    - name: Enlazar el núcleo en ../BAR
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        ln -sfn "$PWD/BAR-local" ../BAR
        test -f ../BAR/Cargo.toml
        test "$(readlink -f ../BAR)" = "$(readlink -f "$PWD/BAR-local")"
        echo "bara queda en $(readlink -f ../BAR)"
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests
      run: cargo test --locked --verbose
    - name: Escritorio Tauri
      run: cargo test --manifest-path src-tauri/Cargo.toml --locked
    - name: Frontend
      run: npm ci && npm run typecheck && npm run test:ai
