# ══════════════════════════════════════════════════════════════════════════
#  Bara IDE Desktop — backend Tauri v2 del IDE Bara (AETHER-Ω)
#
#  Crate miembro del workspace raíz (`../../Cargo.toml`): no declara
#  `[workspace]` propio a propósito, para no romper la pertenencia.
#
#  Capas (una sola dirección, cero duplicación de tipos):
#      web/ (React+TS) --IPC--> src-tauri/ --> bara-ide (lib) --> bara (kernel)
# ══════════════════════════════════════════════════════════════════════════
[package]
name = "bara-ide-desktop"
version = "0.5.0"
edition = "2021"
description = "Aplicacion de escritorio (Tauri v2) del IDE Bara"
license = "MIT"
publish = false

# Biblioteca del backend: `main.rs` sólo arranca la ventana.
[lib]
name = "bara_ide_desktop_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bara-ide-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Inspector web: `tauri dev --features devtools` (o profile debug con la feature).
# Release sin esta feature no enlaza DevTools (F12 queda inerte).
devtools = ["tauri/devtools"]

[dependencies]
# Backend Tauri v2. El único plugin es el diálogo nativo de carpetas:
# el WebView no recibe la ruta, la elige el usuario en el diálogo del sistema.
# `devtools` del crate se activa sólo vía feature (no en release de dist).
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Llavero del sistema (Credential Manager, Keychain, Secret Service).
# Android no entra aquí: el Keystore llega con el APK.
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service"] }

# HTTPS de los proveedores. La clave no sale del proceso.
# rustls + almacén del SO (VPN/antivirus con CA en Windows) y webpki como reserva.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"

# Motor del IDE: la biblioteca `bara-ide` con la feature `serde` activada
# (modelo serializable a JSON) y el kernel `bara` fijado por git (rev en
# el `Cargo.toml` de la raíz).
bara-ide = { path = "..", features = ["serde"] }

# Proceso hijo del kernel. El escritorio lo supervisa; no ejecuta el núcleo.
bara-kernel-host = { path = "../kernel-host" }

# Mismo pin git que la raíz / kernel-host (no `../BAR` suelto).
bara = { git = "https://github.com/usercardjoke1036991-star/Bara-AETHER--Engine-Final-Expansion.git", rev = "fa3d308552f3cc69ccdab8f141d56399e35c2ff6" }
