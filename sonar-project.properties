# El BuildTask del contenedor Gradle es la copia que escribe
# scripts/build_android.ps1 a partir de scripts/android/BuildTask.kt.
# No es un segundo fuente: no cuenta como duplicado.
sonar.cpd.exclusions=src-tauri/gen/android/buildSrc/**/BuildTask.kt

# Harness local CDP (solo máquina de desarrollo; no va al producto).
# Siguen validando WS → 127.0.0.1:9229 en cdp-connect.mjs.
sonar.exclusions=scripts/cdp-*.mjs
